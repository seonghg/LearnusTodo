<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnToDo | 성적 예측</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a class="logo" href="dashboard.html">LearnToDo</a>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">대시보드</a>
                <a href="todo.html" class="nav-item">ToDo</a>
                <a href="grades.html" class="nav-item active">성적 예측</a>
                <a href="mypage.html" class="nav-item">마이페이지</a>
                <form action="/logout" method="post">
                    <button class="nav-item nav-button" type="submit">로그아웃</button>
                </form>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>성적 예측</h1>
                    <p class="muted">평가 비율과 현재 점수를 입력해 예상 최종 점수를 계산합니다.</p>
                </div>
            </header>

            <section class="card">
                <form class="grade-form" data-grade-form>
                    <div class="grade-grid grade-grid-header">
                        <span>항목</span>
                        <span>비율</span>
                        <span>점수</span>
                    </div>

                    <label class="grade-grid">
                        <span>중간고사</span>
                        <input name="midtermWeight" type="number" value="30" min="0" max="100" required>
                        <input name="midtermScore" type="number" value="82" min="0" max="100">
                    </label>

                    <label class="grade-grid">
                        <span>기말고사</span>
                        <input name="finalWeight" type="number" value="35" min="0" max="100" required>
                        <input name="finalScore" type="number" value="90" min="0" max="100">
                    </label>

                    <label class="grade-grid">
                        <span>과제</span>
                        <input name="homeworkWeight" type="number" value="15" min="0" max="100" required>
                        <input name="homeworkScore" type="number" value="95" min="0" max="100">
                    </label>

                    <label class="grade-grid">
                        <span>발표</span>
                        <input name="presentationWeight" type="number" value="10" min="0" max="100" required>
                        <input name="presentationScore" type="number" value="88" min="0" max="100">
                    </label>

                    <label class="grade-grid">
                        <span>출석</span>
                        <input name="attendanceWeight" type="number" value="10" min="0" max="100" required>
                        <input name="attendanceScore" type="number" value="100" min="0" max="100">
                    </label>

                    <div class="action-row">
                        <button class="btn btn-primary" type="submit">예상 점수 계산</button>
                        <a class="btn btn-outline" href="grades_edit.html">상세 입력 화면</a>
                    </div>
                </form>

                <p class="result-box" data-grade-result>계산 결과가 여기에 표시됩니다.</p>
            </section>
        </main>
    </div>

    <script src="js/grades.js"></script>
</body>
</html>
