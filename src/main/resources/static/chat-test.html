<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>챗봇 테스트</title>
</head>
<body>
<h2>학사 챗봇 테스트</h2>
<input type="text" id="userInput" placeholder="질문 입력" style="width:400px">
<button type="button" onClick="sendMessage()">전송</button>
<div id="result" style="margin-top:20px; white-space:pre-wrap"></div>

<script>
    const messages = [
        {
            role: "system",
            content: "당신은 연세대학교 소프트웨어학부 학생을 위한 학사 및 졸업요건 안내 챗봇입니다. 학사 관련 질문만 답변하세요."
        }
    ];

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const result = document.getElementById("result");
        const message = input.value.trim();

        if (!message) {
            input.focus();
            return;
        }

        messages.push({ role: "user", content: message });
        result.textContent = "응답 중...";

        try {
            const res = await fetch("/api/chatbot/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages })
            });

            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.message || `HTTP ${res.status}`);
            }

            result.textContent = data.message;
            messages.push({ role: "assistant", content: data.message });
            input.value = "";
        } catch (error) {
            result.textContent = error.message || "챗봇 응답 중 오류가 발생했습니다.";
            messages.pop();
        }
    }
</script>
</body>
</html>
