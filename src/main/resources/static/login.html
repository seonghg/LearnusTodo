<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnToDo | 로그인</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-intro">
            <p class="eyebrow">LearnUs + Todo</p>
            <h1>수업, 일정, 성적을 한 곳에서 정리합니다.</h1>
            <p>서비스 계정으로 로그인한 뒤 대시보드에서 LearnUs 동기화를 실행할 수 있습니다.</p>
        </section>

        <section class="auth-card">
            <h2>로그인</h2>
            <p class="muted">LearnToDo 서비스 계정으로 접속합니다.</p>

            <form action="/login" method="post" data-app-login-form>
                <label>
                    아이디
                    <input name="username" type="text" autocomplete="username" required>
                </label>

                <label>
                    비밀번호
                    <input name="password" type="password" autocomplete="current-password" required>
                </label>

                <button class="btn btn-primary full-width" type="submit">로그인</button>
            </form>

            <p class="status-message" data-login-status></p>
            <p class="auth-link">계정이 없나요? <a href="register.html">회원가입</a></p>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
