<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnToDo | 대시보드</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a class="logo" href="dashboard.html">LearnToDo</a>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item active">대시보드</a>
                <a href="todo.html" class="nav-item">ToDo</a>
                <a href="grades.html" class="nav-item">성적 예측</a>
                <a href="mypage.html" class="nav-item">마이페이지</a>
                <form action="/logout" method="post">
                    <button class="nav-item nav-button" type="submit">로그아웃</button>
                </form>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>대시보드</h1>
                    <p class="muted"><span data-user-id></span>님의 LearnUs 동기화 데이터입니다.</p>
                </div>
            </header>

            <section class="card sync-card">
                <div>
                    <h2>LearnUs 동기화</h2>
                    <p class="muted">서비스 로그인 후 필요한 때에 LearnUs 강의와 일정을 가져옵니다.</p>
                </div>
                <form class="sync-form" data-learnus-sync-form>
                    <input name="id" type="text" placeholder="LearnUs 아이디" autocomplete="username" required>
                    <input name="password" type="password" placeholder="LearnUs 비밀번호" autocomplete="current-password" required>
                    <button class="btn btn-primary" type="submit">동기화</button>
                </form>
                <p class="status-message" data-sync-status></p>
            </section>

            <section class="status-cards">
                <article class="status-card">
                    <span class="label">강의 수</span>
                    <strong data-course-count>0</strong>
                </article>
                <article class="status-card">
                    <span class="label">일정 수</span>
                    <strong data-event-count>0</strong>
                </article>
                <article class="status-card">
                    <span class="label">평균 진도율</span>
                    <strong data-average-progress>0%</strong>
                </article>
            </section>

            <section class="dashboard-grid">
                <article class="card calendar-card">
                    <div class="section-header">
                        <h2>이번 달 일정</h2>
                        <div class="calendar-controls">
                            <button class="btn btn-outline btn-compact" type="button" data-calendar-prev>&lt;</button>
                            <span class="calendar-month-label" data-calendar-month-label></span>
                            <button class="btn btn-outline btn-compact" type="button" data-calendar-today>Today</button>
                            <button class="btn btn-outline btn-compact" type="button" data-calendar-next>&gt;</button>
                        </div>
                    </div>
                    <table class="calendar-table">
                        <thead>
                            <tr>
                                <th>일</th>
                                <th>월</th>
                                <th>화</th>
                                <th>수</th>
                                <th>목</th>
                                <th>금</th>
                                <th>토</th>
                            </tr>
                        </thead>
                        <tbody data-calendar-body>
                            <tr><td colspan="7">일정을 불러오는 중입니다.</td></tr>
                        </tbody>
                    </table>
                </article>

                <aside class="side-stack">
                    <article class="card">
                        <div class="section-header">
                            <h2>강의 목록</h2>
                        </div>
                        <ul class="data-list" data-course-list>
                            <li class="empty-state">강의를 불러오는 중입니다.</li>
                        </ul>
                    </article>

                    <article class="card">
                        <div class="section-header">
                            <h2>다가오는 일정</h2>
                        </div>
                        <ul class="data-list" data-event-list>
                            <li class="empty-state">일정을 불러오는 중입니다.</li>
                        </ul>
                    </article>
                </aside>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
