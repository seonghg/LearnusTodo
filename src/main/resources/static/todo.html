<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnToDo | ToDo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <a class="logo" href="dashboard.html">LearnToDo</a>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">대시보드</a>
                <a href="todo.html" class="nav-item active">ToDo</a>
                <a href="grades.html" class="nav-item">성적 예측</a>
                <a href="mypage.html" class="nav-item">마이페이지</a>
                <form action="/logout" method="post">
                    <button class="nav-item nav-button" type="submit">로그아웃</button>
                </form>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>ToDo</h1>
                    <p class="muted">내 과목을 선택하고 마감 일정으로 추가합니다.</p>
                </div>
            </header>

            <section class="todo-layout">
                <article class="card">
                    <div class="section-header">
                        <h2>일정 추가</h2>
                    </div>

                    <form class="todo-form" data-todo-form>
                        <label>
                            제목
                            <input name="title" type="text" placeholder="예: 3주차 과제 제출" required>
                        </label>

                        <label>
                            과목
                            <select name="courseId" data-course-select required>
                                <option value="">과목을 불러오는 중입니다.</option>
                            </select>
                        </label>

                        <label>
                            마감일
                            <input name="dueDate" type="datetime-local" required>
                        </label>

                        <label>
                            우선순위
                            <select name="priority" required>
                                <option value="빠름">빠름</option>
                                <option value="보통" selected>보통</option>
                                <option value="느림">느림</option>
                            </select>
                        </label>

                        <button class="btn btn-primary" type="submit">일정표에 추가</button>
                    </form>

                    <p class="status-message" data-todo-status></p>
                </article>

                <article class="card">
                    <div class="section-header">
                        <h2>최근 일정</h2>
                    </div>
                    <ul class="data-list" data-todo-event-list>
                        <li class="empty-state">일정을 불러오는 중입니다.</li>
                    </ul>
                </article>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/todo.js"></script>
</body>
</html>
